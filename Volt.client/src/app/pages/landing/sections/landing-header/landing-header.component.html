<header
  class="lp-header"
  [class.lp-header--open]="menuOpen()"
  [class.lp-header--scrolled]="scrolled() || menuOpen()"
>
  <div class="lp-header__bar lp-container">
    <a class="lp-header__brand" href="#" (click)="$event.preventDefault(); scrollTo('#top')">
      <img src="assets/logo.jpg" alt="ECCO" class="lp-header__logo" width="120" height="40" />
    </a>

    <div class="lp-header__desktop">
      <nav class="lp-header__nav" aria-label="Primary">
        <button type="button" class="lp-header__link" *ngFor="let item of navItems" (click)="scrollTo(item.href)">
          {{ item.key | t }}
        </button>
      </nav>

      <div class="lp-header__lang">
        <button type="button" class="lp-header__icon-btn" (click)="toggleLang()" [attr.title]="'landing.nav.language' | t">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke-width="2"/>
            <path stroke-width="2" d="M3 12h18M12 3c2.5 2.8 3.8 5.8 3.8 9s-1.3 6.2-3.8 9c-2.5-2.8-3.8-5.8-3.8-9S9.5 5.8 12 3z"/>
          </svg>
          <span>{{ localeService.locale() | uppercase }}</span>
        </button>
        <div class="lp-header__lang-menu" *ngIf="langOpen()">
          <button
            type="button"
            *ngFor="let loc of localeService.locales"
            [class.active]="localeService.locale() === loc.code"
            (click)="setLocale(loc.code)"
          >
            {{ loc.native }}
          </button>
        </div>
      </div>

      <button type="button" class="lp-header__icon-btn" (click)="toggleTheme()" [attr.aria-label]="'landing.nav.toggleTheme' | t">
        <svg *ngIf="!theme.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        <svg *ngIf="theme.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
        </svg>
      </button>

      <button type="button" class="lp-header__cta" (click)="scrollTo('#download')">
        {{ 'landing.nav.downloadApp' | t }}
      </button>
    </div>

    <div class="lp-header__mobile">
      <div class="lp-header__lang">
        <button type="button" class="lp-header__icon-btn" (click)="toggleLang()" [attr.title]="'landing.nav.language' | t">
          <span>{{ localeService.locale() | uppercase }}</span>
        </button>
        <div class="lp-header__lang-menu" *ngIf="langOpen()">
          <button
            type="button"
            *ngFor="let loc of localeService.locales"
            [class.active]="localeService.locale() === loc.code"
            (click)="setLocale(loc.code)"
          >
            {{ loc.native }}
          </button>
        </div>
      </div>
      <button type="button" class="lp-header__icon-btn" (click)="toggleTheme()" [attr.aria-label]="'landing.nav.toggleTheme' | t">
        <svg *ngIf="!theme.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg *ngIf="theme.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
      </button>
      <button type="button" class="lp-header__icon-btn" (click)="toggleMenu()" [attr.aria-label]="'landing.nav.toggleMenu' | t">
        <svg *ngIf="!menuOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg *ngIf="menuOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="lp-header__drawer" *ngIf="menuOpen()">
    <button type="button" *ngFor="let item of navItems" (click)="scrollTo(item.href)">{{ item.key | t }}</button>
    <button type="button" class="lp-header__cta" (click)="scrollTo('#download')">{{ 'landing.nav.downloadApp' | t }}</button>
  </div>
</header>
